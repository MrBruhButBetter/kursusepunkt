name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  JAVA_VERSION: '26'

jobs:
  verify:
    name: Test and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Testcontainers needs a Docker daemon; ubuntu-latest runners have one.
      # No service container is declared here on purpose — Testcontainers starts
      # and stops PostgreSQL itself, so the tests are self-contained and run the
      # same way on a laptop.
      - name: Verify
        run: mvn -B verify

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kursusepunkt:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker network create ci
          docker run -d --name db --network ci \
            -e POSTGRES_DB=kursusepunkt -e POSTGRES_USER=app -e POSTGRES_PASSWORD=app \
            postgres:16-alpine
          # Wait for the database rather than sleeping a fixed amount.
          for i in $(seq 1 30); do
            docker exec db pg_isready -U app -d kursusepunkt && break
            sleep 2
          done

          docker run -d --name app --network ci -p 8080:8080 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/kursusepunkt \
            -e SPRING_DATASOURCE_USERNAME=app \
            -e SPRING_DATASOURCE_PASSWORD=app \
            kursusepunkt:${{ github.sha }}

          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health | grep -q UP; then
              echo "Application is healthy"
              exit 0
            fi
            sleep 3
          done

          echo "Application did not become healthy:"
          docker logs app
          exit 1
